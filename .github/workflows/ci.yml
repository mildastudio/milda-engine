name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The npm bundled with Node trips on this tree ("edgesOut" of null); release.yml
      # installs the current npm for the same reason, so CI builds what release ships.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:containment
